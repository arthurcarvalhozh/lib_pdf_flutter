name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mesma versão do .fvmrc, do diagnox e do valvulas. A lib depende de
      # detalhes da pintura do Flutter: trocar a versão aqui é o teste de
      # que uma versão nova do Flutter pode ser usada nos apps.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Pacote
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: App de exemplo
        working-directory: example
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      # Validador independente da lib: todo PDF gerado pelos testes tem de
      # passar no qpdf sem erro nem aviso.
      - name: Leitores e validador de PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils ghostscript python3-pil
          qpdf --version | head -1
          pdftoppm -v 2>&1 | head -1
          gs --version

      - name: Validação dos PDFs (qpdf --check)
        run: |
          status=0
          for f in build/pdfs/*.pdf build/visual/*.pdf example/build/exemplo/*.pdf; do
            if ! out=$(qpdf --check "$f" 2>&1); then
              echo "::error file=$f::$out"
              status=1
            fi
          done
          exit $status

      # Cada caso de test/canvas_visual_test.dart rasterizado pelo Poppler e
      # pelo Ghostscript tem de bater com a pintura do Flutter.
      - name: Comparação visual com a pintura do Flutter
        run: python3 tool/visual_diff.py build/visual

      - name: PDFs gerados pelos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            build/pdfs/*.pdf
            build/visual/
            example/build/exemplo/*.pdf
          if-no-files-found: ignore
